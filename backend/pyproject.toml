[project]
name = "wca-assurance-backend"
version = "0.1.0"
description = "Grounded WCA assistant and local document retrieval"
requires-python = ">=3.11,<4.0"
dependencies = [
    "fastapi>=0.135,<1.0",
    "uvicorn>=0.41,<1.0",
    "openai>=2.28,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "python-multipart>=0.0.20,<0.1",
    "pypdf>=5.0,<8.0",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=8,<10"
httpx = ">=0.28,<1"
ruff = ">=0.12,<1"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
